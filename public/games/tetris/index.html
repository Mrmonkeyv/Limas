<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Block Puzzle / Tetris</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #0f172a;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .canvas-container {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 6px;
    }
    canvas#tetris {
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 130px;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { background: #7dd3fc; }
    .controls {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
      text-align: center;
    }
    .mobile-controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .m-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.active { display: flex; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="canvas-container">
      <canvas id="tetris" width="240" height="480"></canvas>
      <div class="overlay" id="game-over">
        <h2 style="color: #ef4444; font-size: 20px;">GAME OVER</h2>
        <p id="over-score" style="color: #94a3b8; font-size: 13px;"></p>
        <button class="btn" style="width: auto; padding: 8px 16px;" onclick="resetGame()">PLAY AGAIN</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="box">
        <div class="label">Next</div>
        <canvas id="next" width="80" height="80" style="margin: 0 auto; display: block;"></canvas>
      </div>
      <div class="box">
        <div class="label">Score</div>
        <div class="val" id="score">0</div>
      </div>
      <div class="box">
        <div class="label">Lines</div>
        <div class="val" id="lines">0</div>
      </div>
      <div class="box">
        <div class="label">Level</div>
        <div class="val" id="level">1</div>
      </div>
      <button class="btn" onclick="resetGame()">Restart</button>
      <button class="btn" style="background: #475569; color: white;" onclick="togglePause()" id="pause-btn">Pause</button>
    </div>
  </div>

  <div class="mobile-controls">
    <button class="m-btn" onclick="playerMove(-1)">◀</button>
    <button class="m-btn" onclick="playerRotate(1)">↻</button>
    <button class="m-btn" onclick="playerDrop()">▼</button>
    <button class="m-btn" onclick="hardDrop()">⏬</button>
    <button class="m-btn" onclick="playerMove(1)">▶</button>
  </div>

  <div class="controls">
    Arrows: ◀ ▶ Move · ▲ Rotate · ▼ Soft Drop · Space: Hard Drop
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(24, 24);

    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');
    nextContext.scale(20, 20);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(f, type='sine', dur=0.08) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const COLORS = [
      null,
      '#ef4444', // T (Red)
      '#06b6d4', // I (Cyan)
      '#eab308', // O (Yellow)
      '#10b981', // S (Green)
      '#a855f7', // Z (Purple)
      '#3b82f6', // J (Blue)
      '#f97316'  // L (Orange)
    ];

    function createPiece(type) {
      if (type === 'T') return [[0,0,0],[1,1,1],[0,1,0]];
      if (type === 'I') return [[0,2,0,0],[0,2,0,0],[0,2,0,0],[0,2,0,0]];
      if (type === 'O') return [[3,3],[3,3]];
      if (type === 'S') return [[0,4,4],[4,4,0],[0,0,0]];
      if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
      if (type === 'J') return [[0,6,0],[0,6,0],[6,6,0]];
      if (type === 'L') return [[0,7,0],[0,7,0],[0,7,7]];
    }

    const arena = createMatrix(10, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0, lines: 0, level: 1 };
    let nextPiece = null;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let isPaused = false;
    let isGameOver = false;

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
      });
    }

    function arenaSweep() {
      let rowCount = 1;
      let linesCleared = 0;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 100;
        rowCount *= 2;
        linesCleared++;
      }
      if (linesCleared > 0) {
        player.lines += linesCleared;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(120, 800 - (player.level - 1) * 70);
        sfx(linesCleared >= 4 ? 800 : 500, 'triangle', 0.2);
        updateScore();
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerRotate(dir) {
      if (isPaused || isGameOver) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
      sfx(400, 'sine', 0.05);
    }

    function playerMove(dir) {
      if (isPaused || isGameOver) return;
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
      else sfx(300, 'sine', 0.04);
    }

    function playerDrop() {
      if (isPaused || isGameOver) return;
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        sfx(200, 'square', 0.05);
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (isPaused || isGameOver) return;
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      sfx(350, 'sawtooth', 0.08);
      dropCounter = 0;
    }

    function playerReset() {
      const pieces = 'ILJOTSZ';
      if (!nextPiece) {
        nextPiece = createPiece(pieces[Math.floor(pieces.length * Math.random())]);
      }
      player.matrix = nextPiece;
      nextPiece = createPiece(pieces[Math.floor(pieces.length * Math.random())]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      drawNext();

      if (collide(arena, player)) {
        isGameOver = true;
        document.getElementById('over-score').innerText = `Score: ${player.score} · Lines: ${player.lines}`;
        document.getElementById('game-over').classList.add('active');
        sfx(140, 'sawtooth', 0.3);
      }
    }

    function drawNext() {
      nextContext.fillStyle = '#1e293b';
      nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;
      nextPiece.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            nextContext.fillStyle = COLORS[value];
            nextContext.fillRect(x + 0.5, y + 0.5, 0.9, 0.9);
          }
        });
      });
    }

    function updateScore() {
      document.getElementById('score').innerText = player.score;
      document.getElementById('lines').innerText = player.lines;
      document.getElementById('level').innerText = player.level;
    }

    function resetGame() {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      dropInterval = 800;
      isGameOver = false;
      isPaused = false;
      document.getElementById('game-over').classList.remove('active');
      document.getElementById('pause-btn').innerText = 'Pause';
      updateScore();
      nextPiece = null;
      playerReset();
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
    }

    function drawMatrix(matrix, offset, isGhost = false) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = isGhost ? 'rgba(255, 255, 255, 0.15)' : COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 0.95, 0.95);
          }
        });
      });
    }

    function drawGhost() {
      if (!player.matrix) return;
      const ghost = { pos: { ...player.pos }, matrix: player.matrix };
      while (!collide(arena, ghost)) {
        ghost.pos.y++;
      }
      ghost.pos.y--;
      drawMatrix(ghost.matrix, ghost.pos, true);
    }

    function draw() {
      context.fillStyle = '#020617';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      if (player.matrix) {
        drawGhost();
        drawMatrix(player.matrix, player.pos);
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!isPaused && !isGameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', event => {
      if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
        event.preventDefault(); playerMove(-1);
      } else if (event.code === 'ArrowRight' || event.code === 'KeyD') {
        event.preventDefault(); playerMove(1);
      } else if (event.code === 'ArrowDown' || event.code === 'KeyS') {
        event.preventDefault(); playerDrop();
      } else if (event.code === 'ArrowUp' || event.code === 'KeyW') {
        event.preventDefault(); playerRotate(1);
      } else if (event.code === 'Space') {
        event.preventDefault(); hardDrop();
      } else if (event.code === 'KeyP') {
        togglePause();
      }
    });

    resetGame();
    update();
  </script>
</body>
</html>
