<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crossy Hopper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .score-txt { font-size: 20px; font-weight: 800; color: #facc15; }
    .canvas-wrap {
      position: relative;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    canvas { display: block; background: #15803d; }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #fde047; }
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 6px;
      margin-top: 14px;
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      height: 44px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div style="font-weight: 800; font-size: 18px; color: #facc15;">CROSSY HOPPER</div>
    <div class="score-txt">Score: <span id="score">0</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="400" height="480"></canvas>
    <div class="overlay" id="start-overlay">
      <h2 style="font-size: 26px; color: #facc15;">Crossy Hopper</h2>
      <p style="color: #94a3b8; font-size: 13px; text-align: center; max-width: 260px;">Hop across roads and dodge speeding traffic! Don't get squished!</p>
      <button class="btn" onclick="start()">HOP IN</button>
    </div>
    <div class="overlay hidden" id="over-overlay">
      <h2 style="font-size: 26px; color: #ef4444;">SQUISHED!</h2>
      <p id="over-stat" style="color: #cbd5e1; font-size: 14px;"></p>
      <button class="btn" onclick="start()">TRY AGAIN</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="t-btn" onclick="move(0, -1)">▲</button>
    <div></div>
    <button class="t-btn" onclick="move(-1, 0)">◀</button>
    <button class="t-btn" onclick="move(0, 1)">▼</button>
    <button class="t-btn" onclick="move(1, 0)">▶</button>
  </div>

  <div class="hint">Arrow Keys / WASD / Tap buttons to hop</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const laneH = 40;
    const laneCount = canvas.height / laneH;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, dur=0.06, type='sine') {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let player = { col: 5, row: 11, maxRow: 11 };
    let lanes = [];
    let score = 0;
    let isPlaying = false;

    function initLanes() {
      lanes = [];
      for (let r = 0; r < laneCount; r++) {
        if (r === 0 || r === 5 || r === 11) {
          lanes.push({ type: 'grass', vehicles: [] });
        } else {
          const speed = (Math.random() * 2 + 1.5) * (Math.random() > 0.5 ? 1 : -1);
          const color = ['#ef4444', '#3b82f6', '#f97316', '#a855f7'][Math.floor(Math.random()*4)];
          const vehicles = [];
          for (let v = 0; v < 3; v++) {
            vehicles.push({ x: v * 150 + Math.random() * 40, w: 46, h: 26, color });
          }
          lanes.push({ type: 'road', speed, vehicles });
        }
      }
    }

    function start() {
      player = { col: 5, row: 11, maxRow: 11 };
      score = 0;
      document.getElementById('score').innerText = '0';
      initLanes();
      isPlaying = true;
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('over-overlay').classList.add('hidden');
      beep(550, 0.1);
    }

    function gameOver() {
      isPlaying = false;
      beep(130, 0.3, 'sawtooth');
      document.getElementById('over-stat').innerText = `Final Score: ${score}`;
      document.getElementById('over-overlay').classList.remove('hidden');
    }

    function move(dc, dr) {
      if (!isPlaying) return;
      player.col = Math.max(0, Math.min(9, player.col + dc));
      player.row += dr;

      if (player.row < 0) {
        // Player reached the top! Reset to bottom and cycle lanes with increased speed
        score += 10;
        document.getElementById('score').innerText = score;
        player.row = 11;
        initLanes();
        beep(880, 0.15);
      } else if (player.row > 11) {
        player.row = 11;
      } else {
        if (dr < 0) {
          score += 1;
          document.getElementById('score').innerText = score;
          beep(400, 0.05);
        } else {
          beep(320, 0.04);
        }
      }
    }

    function update() {
      if (!isPlaying) return;

      // Update vehicles in road lanes
      for (let r = 0; r < lanes.length; r++) {
        const lane = lanes[r];
        if (lane.type === 'road') {
          for (let v of lane.vehicles) {
            v.x += lane.speed;
            if (lane.speed > 0 && v.x > canvas.width) v.x = -v.w;
            if (lane.speed < 0 && v.x < -v.w) v.x = canvas.width;

            // Hit test if player is in this lane
            if (player.row === r) {
              const px = player.col * 40 + 8;
              const pw = 24;
              if (px + pw > v.x && px < v.x + v.w) {
                return gameOver();
              }
            }
          }
        }
      }
    }

    function draw() {
      // Draw lanes
      for (let r = 0; r < lanes.length; r++) {
        const lane = lanes[r];
        const y = r * laneH;
        if (lane.type === 'grass') {
          ctx.fillStyle = '#166534';
          ctx.fillRect(0, y, canvas.width, laneH);
        } else {
          ctx.fillStyle = '#334155';
          ctx.fillRect(0, y, canvas.width, laneH);
          // Road lane divider
          ctx.strokeStyle = '#64748b';
          ctx.setLineDash([10, 10]);
          ctx.beginPath();
          ctx.moveTo(0, y + laneH);
          ctx.lineTo(canvas.width, y + laneH);
          ctx.stroke();
          ctx.setLineDash([]);

          // Vehicles
          for (let v of lane.vehicles) {
            ctx.fillStyle = v.color;
            ctx.beginPath();
            ctx.roundRect(v.x, y + 7, v.w, v.h, 5);
            ctx.fill();

            // Windshield
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(v.x + (lane.speed > 0 ? 28 : 6), y + 10, 10, 20);
          }
        }
      }

      // Draw Player (Chicken)
      const px = player.col * 40 + 20;
      const py = player.row * laneH + 20;

      // Body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(px, py, 13, 0, Math.PI * 2);
      ctx.fill();

      // Comb
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(px, py - 13, 4, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(px - 4, py - 12);
      ctx.lineTo(px, py - 18);
      ctx.lineTo(px + 4, py - 12);
      ctx.closePath();
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(px - 5, py - 6, 3, 3);
      ctx.fillRect(px + 2, py - 6, 3, 3);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move(1, 0); }
    });

    initLanes();
    loop();
  </script>
</body>
</html>
