<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brick Breaker DX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .stats { display: flex; gap: 14px; font-size: 14px; font-weight: 700; }
    .score-txt { color: #f59e0b; }
    .lives-txt { color: #ef4444; }
    .canvas-wrap {
      position: relative;
      border: 2px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(0,0,0,0.6);
    }
    canvas { display: block; background: #0f172a; }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #fbbf24; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div style="font-weight: 800; font-size: 18px; color: #f59e0b;">BRICK BREAKER</div>
    <div class="stats">
      <div>Score: <span class="score-txt" id="score">0</span></div>
      <div>Lives: <span class="lives-txt" id="lives">❤️❤️❤️</span></div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="480" height="420"></canvas>
    <div class="overlay" id="start-overlay">
      <h2 style="font-size: 24px; color: #f59e0b;">Breakout Arcade</h2>
      <p style="color: #94a3b8; font-size: 13px;">Destroy all colored bricks! Move with mouse/arrow keys.</p>
      <button class="btn" onclick="startGame()">START GAME</button>
    </div>
    <div class="overlay hidden" id="game-over-overlay">
      <h2 style="font-size: 24px; color: #ef4444;" id="over-title">GAME OVER</h2>
      <p style="color: #cbd5e1; font-size: 14px;" id="over-desc">Better luck next time!</p>
      <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Mouse / Touch / Left-Right Arrow Keys</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, dur=0.06, type='sine') {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const paddle = { w: 85, h: 12, x: 0, speed: 8 };
    const ball = { x: 0, y: 0, r: 6, vx: 4, vy: -4, active: false };
    let score = 0;
    let lives = 3;
    let isPlaying = false;

    const rowCount = 5;
    const colCount = 8;
    const brickW = 50;
    const brickH = 16;
    const brickPadding = 6;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 20;

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
    let bricks = [];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < colCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < rowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
        }
      }
    }

    function resetPaddleBall() {
      paddle.x = (canvas.width - paddle.w) / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 40;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.8;
      ball.vy = -4.2;
    }

    function startGame() {
      score = 0;
      lives = 3;
      document.getElementById('score').innerText = score;
      document.getElementById('lives').innerText = '❤️❤️❤️';
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('game-over-overlay').classList.add('hidden');
      initBricks();
      resetPaddleBall();
      isPlaying = true;
      beep(440, 0.1);
    }

    let rightPressed = false;
    let leftPressed = false;

    window.addEventListener('keydown', e => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.code === 'KeyD') rightPressed = true;
      if (e.key === 'Left' || e.key === 'ArrowLeft' || e.code === 'KeyA') leftPressed = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.code === 'KeyD') rightPressed = false;
      if (e.key === 'Left' || e.key === 'ArrowLeft' || e.code === 'KeyA') leftPressed = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relativeX - paddle.w / 2));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.touches[0].clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relativeX - paddle.w / 2));
    }, { passive: false });

    function collisionDetection() {
      let remaining = 0;
      for (let c = 0; c < colCount; c++) {
        for (let r = 0; r < rowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            remaining++;
            if (
              ball.x > b.x &&
              ball.x < b.x + brickW &&
              ball.y > b.y &&
              ball.y < b.y + brickH
            ) {
              ball.vy = -ball.vy;
              b.status = 0;
              score += 20;
              document.getElementById('score').innerText = score;
              beep(500 + r * 60, 0.05);
            }
          }
        }
      }

      if (remaining === 0) {
        isPlaying = false;
        document.getElementById('over-title').innerText = 'YOU WON! 🏆';
        document.getElementById('over-title').style.color = '#22c55e';
        document.getElementById('over-desc').innerText = `Amazing! All bricks cleared! Score: ${score}`;
        document.getElementById('game-over-overlay').classList.remove('hidden');
        beep(700, 0.3);
      }
    }

    function update() {
      if (!isPlaying) return;

      if (rightPressed) paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);
      if (leftPressed) paddle.x = Math.max(0, paddle.x - paddle.speed);

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Side walls
      if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) {
        ball.vx = -ball.vx;
        beep(300, 0.04);
      }
      // Top wall
      if (ball.y - ball.r < 0) {
        ball.vy = -ball.vy;
        beep(300, 0.04);
      } else if (ball.y + ball.r > canvas.height - 20) {
        // Paddle collision
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
          ball.vy = -Math.abs(ball.vy);
          // Angle modifier based on hit position
          const hitPoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          ball.vx = hitPoint * 5;
          beep(400, 0.06);
        } else if (ball.y + ball.r > canvas.height) {
          lives--;
          document.getElementById('lives').innerText = '❤️'.repeat(Math.max(0, lives));
          beep(180, 0.2, 'sawtooth');
          if (lives <= 0) {
            isPlaying = false;
            document.getElementById('over-title').innerText = 'GAME OVER';
            document.getElementById('over-title').style.color = '#ef4444';
            document.getElementById('over-desc').innerText = `Final Score: ${score}`;
            document.getElementById('game-over-overlay').classList.remove('hidden');
          } else {
            resetPaddleBall();
          }
        }
      }

      collisionDetection();
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < colCount; c++) {
        for (let r = 0; r < rowCount; r++) {
          if (bricks[c] && bricks[c][r].status === 1) {
            const brickX = c * (brickW + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickH + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickW, brickH, 3);
            ctx.fill();
          }
        }
      }

      // Draw paddle
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.roundRect(paddle.x, canvas.height - 20, paddle.w, paddle.h, 6);
      ctx.fill();

      // Draw ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initBricks();
    resetPaddleBall();
    loop();
  </script>
</body>
</html>
