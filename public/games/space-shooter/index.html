<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galaxy Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #05070f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand { font-weight: 800; font-size: 18px; color: #38bdf8; }
    .stats { display: flex; gap: 14px; font-size: 14px; font-weight: 700; }
    .canvas-wrap {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0,0,0,0.7);
    }
    canvas { display: block; background: #020617; }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">GALAXY DEFENDER</div>
    <div class="stats">
      <div>Score: <span style="color: #38bdf8;" id="score">0</span></div>
      <div>Shield: <span style="color: #4ade80;" id="shield">100%</span></div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="440" height="520"></canvas>
    <div class="overlay" id="start-overlay">
      <h2 style="font-size: 26px; color: #38bdf8;">Galaxy Defender</h2>
      <p style="color: #94a3b8; font-size: 13px; text-align: center; max-width: 280px;">Defend your starship from incoming alien invaders! Mouse or touch to steer and autofire.</p>
      <button class="btn" onclick="start()">ENGAGE</button>
    </div>
    <div class="overlay hidden" id="over-overlay">
      <h2 style="font-size: 26px; color: #ef4444;">MISSION FAILED</h2>
      <p id="over-stat" style="color: #cbd5e1; font-size: 14px;"></p>
      <button class="btn" onclick="start()">RETRY MISSION</button>
    </div>
  </div>

  <div class="hint">Move mouse/touch to pilot ship · Arrow keys / Spacebar supported</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(f, type='sine', dur=0.06) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let player = { x: canvas.width / 2, y: canvas.height - 50, r: 16, shield: 100 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let score = 0;
    let isPlaying = false;
    let frame = 0;

    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1 });
    }

    function start() {
      player.x = canvas.width / 2;
      player.shield = 100;
      bullets = [];
      enemies = [];
      particles = [];
      score = 0;
      frame = 0;
      isPlaying = true;
      document.getElementById('score').innerText = '0';
      document.getElementById('shield').innerText = '100%';
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('over-overlay').classList.add('hidden');
      sfx(520, 'triangle', 0.1);
    }

    function gameOver() {
      isPlaying = false;
      sfx(120, 'sawtooth', 0.4);
      document.getElementById('over-stat').innerText = `Final Score: ${score}`;
      document.getElementById('over-overlay').classList.remove('hidden');
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      player.x = Math.max(20, Math.min(canvas.width - 20, e.clientX - rect.left));
      player.y = Math.max(100, Math.min(canvas.height - 30, e.clientY - rect.top));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      player.x = Math.max(20, Math.min(canvas.width - 20, e.touches[0].clientX - rect.left));
      player.y = Math.max(100, Math.min(canvas.height - 30, e.touches[0].clientY - rect.top));
    }, { passive: false });

    function addExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 25,
          color
        });
      }
    }

    function update() {
      // Starfield
      for (let s of stars) {
        s.y += s.s * 1.5;
        if (s.y > canvas.height) s.y = 0;
      }

      if (!isPlaying) return;
      frame++;

      // Auto fire laser
      if (frame % 12 === 0) {
        bullets.push({ x: player.x - 10, y: player.y - 15, vy: -9 });
        bullets.push({ x: player.x + 10, y: player.y - 15, vy: -9 });
        sfx(800, 'sine', 0.04);
      }

      // Update bullets
      for (let b of bullets) b.y += b.vy;
      bullets = bullets.filter(b => b.y > -20);

      // Spawn enemies
      if (frame % 45 === 0) {
        enemies.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -20,
          vx: (Math.random() - 0.5) * 2,
          vy: Math.random() * 2 + 1.8,
          hp: 2,
          color: Math.random() > 0.5 ? '#f43f5e' : '#a855f7'
        });
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.vy;
        e.x += e.vx;
        if (e.x < 20 || e.x > canvas.width - 20) e.vx = -e.vx;

        // Player Collision
        const dist = Math.hypot(e.x - player.x, e.y - player.y);
        if (dist < 26) {
          player.shield -= 30;
          addExplosion(e.x, e.y, '#f43f5e');
          enemies.splice(i, 1);
          sfx(160, 'sawtooth', 0.2);
          if (player.shield <= 0) {
            player.shield = 0;
            document.getElementById('shield').innerText = '0%';
            return gameOver();
          }
          document.getElementById('shield').innerText = `${player.shield}%`;
          continue;
        }

        // Bullet Collision
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < 20) {
            bullets.splice(j, 1);
            e.hp--;
            sfx(600, 'square', 0.04);
            if (e.hp <= 0) {
              addExplosion(e.x, e.y, e.color);
              enemies.splice(i, 1);
              score += 100;
              document.getElementById('score').innerText = score;
              break;
            }
          }
        }

        if (e.y > canvas.height + 20) {
          enemies.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#94a3b8';
      for (let s of stars) {
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }

      // Bullets
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      for (let b of bullets) {
        ctx.fillRect(b.x - 2, b.y, 4, 12);
      }
      ctx.shadowBlur = 0;

      // Enemies
      for (let e of enemies) {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + 14);
        ctx.lineTo(e.x - 14, e.y - 10);
        ctx.lineTo(e.x, e.y - 4);
        ctx.lineTo(e.x + 14, e.y - 10);
        ctx.closePath();
        ctx.fill();
      }

      // Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 18);
      ctx.lineTo(player.x - 16, player.y + 14);
      ctx.lineTo(player.x, player.y + 8);
      ctx.lineTo(player.x + 16, player.y + 14);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(player.x, player.y - 4, 4, 0, Math.PI * 2);
      ctx.fill();

      // Thruster flame
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(player.x - 6, player.y + 10);
      ctx.lineTo(player.x, player.y + 18 + Math.random() * 6);
      ctx.lineTo(player.x + 6, player.y + 10);
      ctx.fill();

      // Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
